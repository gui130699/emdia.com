    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta
      name="description"
      content="EM DIA — seu dinheiro, sempre em dia. Controle receitas, despesas, contas, cartões e metas em um só lugar."
    />
    <link rel="apple-touch-icon" href="/emdia.com/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>EM DIA</title>
    <script>
      (() => {
        try {
          const appearance = JSON.parse(localStorage.getItem("emdia:appearance") || "null");
          if (!appearance) return;
          const dark = appearance.theme === "dark" || (appearance.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          if (appearance.density) document.documentElement.dataset.density = appearance.density;
          const accent = {
            "#059669": ["#059669", "#064e3b"], "#2563eb": ["#2563eb", "#1e3a8a"],
            "#7c3aed": ["#7c3aed", "#4c1d95"], "#ea580c": ["#ea580c", "#7c2d12"],
            "#dc2626": ["#dc2626", "#7f1d1d"], "#0d9488": ["#0d9488", "#134e4a"]
          }[appearance.accentColor];
          if (accent) {
            document.documentElement.style.setProperty("--color-brand-600", accent[0]);
            document.documentElement.style.setProperty("--color-brand-900", accent[1]);
          }
        } catch {}
      })();
    </script>
